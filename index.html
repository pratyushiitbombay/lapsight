    <meta name="apple-mobile-web-app-title" content="Lapsight" />
    <script>
      // Apply the saved light/dark choice before the page draws (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('fitviewer.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
